name: Publish
run-name: Publish ${{ github.repository }} for ${{ github.ref_name }}

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-beta[1-9][0-9]*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check cluster_monitor scripts tests

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Test
        run: python -m unittest discover -s tests

  publish:
    name: Publish Forgejo package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Package release artifacts
        run: |
          python -m scripts.package_artifacts --release-tag "$GITHUB_REF_NAME"
          ls dist/*.tar.gz dist/*linux_armv7l.whl dist/*linux_aarch64.whl
      - name: Publish to Forgejo
        env:
          FORGEJO_PACKAGE_USERNAME: ${{ secrets.FORGEJO_PACKAGE_USERNAME }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: |
          python -m scripts.publish_forgejo \
            --simple-index-url "https://forgejo.alexlab.nl/api/packages/public/pypi/simple"
        # Twine is only called in scripts.publish_forgejo.
