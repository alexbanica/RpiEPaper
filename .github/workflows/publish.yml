name: Forgejo Python Package Publish

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: forgejo-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: lint
        run: ruff check cluster_monitor scripts tests

  test:
    runs-on: ubuntu-latest
    name: test (${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: tests
        run: python -m unittest discover -s tests

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: package release artifacts
        run: |
          python -m scripts.package_artifacts --release-tag "$GITHUB_REF_NAME"
          ls dist/*.tar.gz dist/*linux_armv7l.whl dist/*linux_aarch64.whl
      - name: upload release artifacts
        env:
          FORGEJO_PACKAGE_USERNAME: ${{ vars.FORGEJO_PACKAGE_USERNAME }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: |
          python -m scripts.publish_forgejo \
            --simple-index-url "https://forgejo.alexlab.nl/api/packages/public/pypi/simple"
        # Twine is only called in scripts.publish_forgejo.
